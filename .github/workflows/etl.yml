name: India AQI Hourly ETL Pipeline

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL Pipeline
        run: |
          python run_etl.py

      - name: Run Pytest Tests
        run: |
          pytest tests/ -v

      - name: Commit and Push Updated Data (if changed)
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add db/aqi.db data/processed/*.csv
          if git diff --staged --quiet; then
            echo "No data changes detected. Nothing to commit."
          else
            git commit -m "chore(data): auto-update AQI database and processed CSVs [skip ci]"
            git push
          fi
